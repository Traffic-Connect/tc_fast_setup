    source "$PROJECT_ROOT/.env"
fi

# ============================================================================
# ПРОВЕРКА КОНФИГУРАЦИИ
# ============================================================================

# Функция проверки обязательных переменных
validate_config() {
    local required_vars=(
        "PROJECT_ROOT"
        "LOG_DIR"
        "CONFIG_DIR"
        "BACKUP_DIR"
        "TEMP_DIR"
    )
    
    for var in "${required_vars[@]}"; do
        if [ -z "${!var}" ]; then
            echo "❌ Ошибка конфигурации: переменная $var не определена"
            return 1
        fi
    done
    
    return 0
}

# Автоматическая проверка при загрузке
if ! validate_config; then
    echo "❌ Критическая ошибка конфигурации"
    exit 1
fi
